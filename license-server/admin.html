<!DOCTYPE html>
<html lang="en">
<!--
  Object Name    : admin.html
  Object Type    : Local operator console (single file, no build, no deps)
  Purpose        : Look up a customer, see swallowed payments, grant or revoke —
                   without PowerShell, from any device including a phone.
  Created By     : Gaurav Jain
  Created Date   : 22-Sep-2026
  Dependencies   : The redditdl-license Worker's /admin/* routes + CORS.

  OPEN THIS FROM YOUR OWN DISK (file://). Never host it. It is not in the
  extension package (build.ps1 uses an allowlist) and it holds no secret of its
  own — you type the admin secret in, and it is kept in sessionStorage so it
  dies when the tab closes.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RedditDL — operator console</title>
    <style>
        :root {
            --bg: #fbfaf7; --card: #fff; --ink: #1f2330; --mute: #5b6273;
            --faint: #a1a6b3; --line: #e6e0d4; --accent: #b18a5e;
            --ok: #0f7b3d; --okbg: rgba(16,185,129,0.08);
            --bad: #b3261e; --badbg: rgba(239,68,68,0.07);
            --warn: #8a6d1f; --warnbg: rgba(245,158,11,0.10);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #22222a; --card: #2d2d36; --ink: #f5f4f0; --mute: #c0bdb6;
                --faint: #8b8881; --line: #3a3a44; --accent: #dbb481;
                --ok: #4ade80; --okbg: rgba(16,185,129,0.12);
                --bad: #f87171; --badbg: rgba(239,68,68,0.12);
                --warn: #fbbf24; --warnbg: rgba(245,158,11,0.14);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px 16px 64px; background: var(--bg); color: var(--ink);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .wrap { max-width: 760px; margin: 0 auto; }
        h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.01em; }
        .sub { color: var(--faint); font-size: 13px; margin: 0 0 24px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        h2 { font-size: 15px; margin: 0 0 12px; letter-spacing: 0.01em; }
        label { display: block; font-size: 12.5px; color: var(--mute); margin-bottom: 5px; font-weight: 600; }
        input, select {
            width: 100%; padding: 11px 13px; border-radius: 9px; border: 1.5px solid var(--line);
            background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; margin-bottom: 11px;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        button {
            padding: 11px 18px; border-radius: 9px; border: none; background: var(--ink); color: var(--bg);
            font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; margin-right: 8px; margin-bottom: 6px;
        }
        button:hover { opacity: 0.88; }
        button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
        button.danger { background: var(--bad); color: #fff; }
        button:disabled { opacity: 0.45; cursor: default; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .row > div { flex: 1; min-width: 190px; }
        .out { margin-top: 13px; padding: 13px 15px; border-radius: 10px; font-size: 14px; display: none; }
        .out.show { display: block; }
        .out.ok { background: var(--okbg); color: var(--ok); border: 1px solid var(--ok); }
        .out.bad { background: var(--badbg); color: var(--bad); border: 1px solid var(--bad); }
        .out.warn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--warn); }
        .out.plain { background: var(--bg); border: 1px solid var(--line); color: var(--mute); }
        .out b { display: block; font-size: 15px; margin-bottom: 4px; color: inherit; }
        .kv { font-size: 13px; color: var(--mute); margin-top: 8px; }
        .kv div { display: flex; gap: 10px; padding: 2px 0; }
        .kv span:first-child { color: var(--faint); min-width: 118px; }
        .say {
            margin-top: 11px; padding: 11px 13px; border-radius: 8px; background: var(--bg);
            border: 1px dashed var(--line); color: var(--ink); font-size: 13.5px;
        }
        .say em { color: var(--faint); font-style: normal; display: block; margin-bottom: 4px; font-size: 12px; }
        .orphan { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px; background: var(--bg); }
        .orphan .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
        .orphan .why { font-size: 12.5px; color: var(--bad); font-weight: 600; margin-top: 3px; }
        .orphan .meta { font-size: 12px; color: var(--faint); margin-top: 3px; }
        .banner { padding: 13px 16px; border-radius: 11px; margin-bottom: 16px; font-weight: 600; font-size: 14px; display: none; }
        .banner.show { display: block; }
        .banner.bad { background: var(--badbg); color: var(--bad); border: 1px solid var(--bad); }
        .banner.ok { background: var(--okbg); color: var(--ok); border: 1px solid var(--ok); }
        code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
        .hint { font-size: 12.5px; color: var(--faint); margin: 8px 0 0; }
    </style>
</head>

<body>
<div class="wrap">
    <h1>RedditDL — operator console</h1>
    <p class="sub">Local file. Nothing is sent anywhere except your own Worker.</p>

    <div class="card">
        <label for="secret">Admin secret</label>
        <input id="secret" type="password" placeholder="paste your ADMIN_SECRET" autocomplete="off">
        <label for="host">Worker host</label>
        <input id="host" type="text" value="redditdl-license.reddit-downloader.workers.dev" autocomplete="off">
        <button id="connect">Connect</button>
        <span class="hint">Kept in this tab only — closing it forgets the secret.</span>
        <div id="connOut" class="out"></div>
    </div>

    <div id="alertBanner" class="banner"></div>

    <div class="card">
        <h2>A customer says their download isn't working</h2>
        <div class="row">
            <div>
                <label for="email">The email they paid with</label>
                <input id="email" type="email" placeholder="them@example.com" autocomplete="off">
            </div>
        </div>
        <button id="lookup">Look them up</button>
        <div id="lookupOut" class="out"></div>
        <div id="lookupSay" class="say" style="display:none"></div>
        <div id="lookupActions" style="margin-top:12px"></div>
    </div>

    <div class="card">
        <h2>Payments that took money and minted nothing</h2>
        <button id="orphans" class="ghost">Check now</button>
        <div id="orphanOut" class="out"></div>
        <div id="orphanList"></div>
    </div>

    <div class="card">
        <h2>Give someone a licence by hand</h2>
        <div class="row">
            <div>
                <label for="grantEmail">Email</label>
                <input id="grantEmail" type="email" placeholder="them@example.com" autocomplete="off">
            </div>
            <div>
                <label for="grantPlan">Plan</label>
                <select id="grantPlan">
                    <option value="monthly">monthly — 30 days ($1)</option>
                    <option value="annual">annual — 365 days ($5)</option>
                    <option value="lifetime">lifetime — never expires ($10)</option>
                </select>
            </div>
        </div>
        <label for="grantNote">Note (why — e.g. "Ko-fi txn 12345, non-USD")</label>
        <input id="grantNote" type="text" placeholder="reason, for your own records" autocomplete="off">
        <button id="grant">Grant licence</button>
        <div id="grantOut" class="out"></div>
        <div id="grantSay" class="say" style="display:none"></div>
    </div>

    <div class="card">
        <h2>Recent licences</h2>
        <button id="recent" class="ghost">Load</button>
        <div id="recentOut" class="out"></div>
    </div>
</div>

<script>
(function () {
    var S = sessionStorage;
    var $ = function (id) { return document.getElementById(id); };

    function base() { return 'https://' + $('host').value.trim().replace(/^https?:\/\//, '').replace(/\/+$/, ''); }
    function headers() { return { 'X-Admin-Secret': S.getItem('adminSecret') || '' }; }

    function show(el, kind, html) {
        el.className = 'out show ' + kind;
        el.innerHTML = html;
    }
    function hide(el) { el.className = 'out'; }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function when(unix) {
        if (!unix) return '—';
        return new Date(unix * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Every call funnels through here so a wrong secret or a dead Worker reads
    // the same way everywhere instead of throwing a raw fetch error.
    function call(path, opts) {
        return fetch(base() + path, Object.assign({ headers: headers() }, opts || {}))
            .then(function (res) {
                if (res.status === 401) throw new Error('Wrong admin secret.');
                if (res.status === 404 && path.indexOf('/admin/') === 0) {
                    throw new Error('Route not found — the Worker is running older code. Run: wrangler deploy');
                }
                return res.json().then(function (body) {
                    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
                    return body;
                });
            });
    }

    // ---- connect ----------------------------------------------------------
    $('connect').addEventListener('click', function () {
        var sec = $('secret').value.trim();
        if (!sec) { show($('connOut'), 'bad', 'Enter the admin secret first.'); return; }
        S.setItem('adminSecret', sec);
        S.setItem('adminHost', $('host').value.trim());
        show($('connOut'), 'plain', 'Checking…');
        call('/admin/licenses')
            .then(function (d) {
                show($('connOut'), 'ok', '<b>Connected.</b>' + d.returned + ' licence(s) on record.');
                checkOrphansQuietly();
            })
            .catch(function (e) { show($('connOut'), 'bad', '<b>Not connected.</b>' + esc(e.message)); });
    });

    if (S.getItem('adminSecret')) {
        $('secret').value = S.getItem('adminSecret');
        if (S.getItem('adminHost')) $('host').value = S.getItem('adminHost');
    }

    // A standing red banner if money has gone missing — the thing you would
    // otherwise only discover from an angry email weeks later.
    function checkOrphansQuietly() {
        call('/admin/orphans').then(function (d) {
            var b = $('alertBanner');
            if (d.returned > 0) {
                b.className = 'banner show bad';
                b.textContent = '⚠ ' + d.returned + ' payment(s) took money but minted no licence. Scroll down and resolve them.';
            } else {
                b.className = 'banner show ok';
                b.textContent = '✓ No swallowed payments.';
            }
        }).catch(function () { /* banner is a nicety, never block on it */ });
    }

    // ---- lookup -----------------------------------------------------------
    $('lookup').addEventListener('click', function () {
        var email = $('email').value.trim();
        var out = $('lookupOut'), say = $('lookupSay'), acts = $('lookupActions');
        say.style.display = 'none'; acts.innerHTML = '';
        if (!email) { show(out, 'bad', 'Enter their email.'); return; }
        show(out, 'plain', 'Looking up…');

        call('/admin/lookup?email=' + encodeURIComponent(email)).then(function (d) {
            if (!d.found) {
                show(out, 'bad', '<b>No licence for that address.</b>They may have paid with a different email — check the orphans list below, then your Ko-fi supporters list. If the payment is real, grant it by hand.');
                $('grantEmail').value = email;
                return;
            }
            var rows =
                '<div class="kv">' +
                '<div><span>Plan</span><span>' + esc(d.plan) + '</span></div>' +
                '<div><span>Status</span><span>' + esc(d.status) + '</span></div>' +
                '<div><span>Expires</span><span>' + (d.currentPeriodEnd ? when(d.currentPeriodEnd) : 'never') + '</span></div>' +
                '<div><span>Paid</span><span>' + (d.amountUSD != null ? '$' + d.amountUSD : '—') + ' via ' + esc(d.source) + '</span></div>' +
                '<div><span>Created</span><span>' + when(d.createdAt) + '</span></div>' +
                '</div>';

            if (d.valid) {
                show(out, 'ok', '<b>Their licence is active.</b>Nothing is wrong on our side — they have almost certainly typed a different address into the extension.' + rows);
                say.style.display = 'block';
                say.innerHTML = '<em>Reply with:</em>Your licence is active under <b>' + esc(email) + '</b>. Open the extension\'s Welcome tab → <b>Already paid? Unlock it here</b> → enter exactly that address. If it still doesn\'t work, reload the Reddit tab and try once more.';
            } else {
                show(out, 'warn', '<b>Found, but not currently valid.</b>' + rows);
                say.style.display = 'block';
                say.innerHTML = '<em>Reply with:</em>Your licence ran out on ' + when(d.currentPeriodEnd) + '. Pay again on Ko-fi with the same email and it reactivates within seconds.';
                var ext = document.createElement('button');
                ext.textContent = 'Extend as a goodwill fix';
                ext.addEventListener('click', function () { $('grantEmail').value = email; $('grantNote').value = 'goodwill extension'; $('grantEmail').scrollIntoView({ behavior: 'smooth' }); });
                acts.appendChild(ext);
            }

            var rev = document.createElement('button');
            rev.textContent = 'Revoke (refund / chargeback)';
            rev.className = 'danger';
            rev.addEventListener('click', function () {
                if (!confirm('Revoke the licence for ' + email + '?\n\nThey lose access immediately. Only do this for a refund or chargeback.')) return;
                call('/admin/revoke', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
                    body: JSON.stringify({ email: email, reason: 'revoked from operator console' })
                }).then(function () { show(out, 'warn', '<b>Revoked.</b>' + esc(email) + ' no longer has access.'); })
                  .catch(function (e) { show(out, 'bad', esc(e.message)); });
            });
            acts.appendChild(rev);
        }).catch(function (e) { show(out, 'bad', '<b>Lookup failed.</b>' + esc(e.message)); });
    });

    // ---- orphans ----------------------------------------------------------
    $('orphans').addEventListener('click', function () {
        var out = $('orphanOut'), list = $('orphanList');
        list.innerHTML = '';
        show(out, 'plain', 'Checking…');

        call('/admin/orphans').then(function (d) {
            if (!d.returned) {
                show(out, 'ok', '<b>Nothing swallowed.</b>Every payment so far produced a licence.');
                return;
            }
            show(out, 'bad', '<b>' + d.returned + ' payment(s) took money and minted nothing.</b>Grant each one by hand once you have confirmed it in Ko-fi.');
            d.orphans.forEach(function (o) {
                var div = document.createElement('div');
                div.className = 'orphan';
                div.innerHTML =
                    '<div class="top"><span><b>' + esc(o.email || 'no email on the payment') + '</b></span>' +
                    '<span>' + (o.amountUSD != null ? '$' + o.amountUSD : '?') + ' ' + esc(o.currency || '') + '</span></div>' +
                    '<div class="why">' + esc(o.reason) + (o.detail ? ' — ' + esc(o.detail) : '') + '</div>' +
                    '<div class="meta">' + esc(o.source) + ' · ' + when(o.at) + ' · <code>' + esc(o.txnId || o.id) + '</code></div>';
                if (o.email) {
                    var b = document.createElement('button');
                    b.textContent = 'Fill grant form';
                    b.className = 'ghost';
                    b.style.marginTop = '9px';
                    b.addEventListener('click', function () {
                        $('grantEmail').value = o.email;
                        $('grantNote').value = o.source + ' txn ' + (o.txnId || o.id) + ' — ' + o.reason;
                        if (o.amountUSD >= 9.99) $('grantPlan').value = 'lifetime';
                        else if (o.amountUSD >= 4.99) $('grantPlan').value = 'annual';
                        else $('grantPlan').value = 'monthly';
                        $('grantEmail').scrollIntoView({ behavior: 'smooth' });
                    });
                    div.appendChild(b);
                }
                list.appendChild(div);
            });
        }).catch(function (e) { show(out, 'bad', esc(e.message)); });
    });

    // ---- grant ------------------------------------------------------------
    $('grant').addEventListener('click', function () {
        var email = $('grantEmail').value.trim();
        var out = $('grantOut'), say = $('grantSay');
        say.style.display = 'none';
        if (!email) { show(out, 'bad', 'Enter an email.'); return; }
        show(out, 'plain', 'Granting…');

        call('/admin/grant', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
            body: JSON.stringify({ email: email, plan: $('grantPlan').value, note: $('grantNote').value.trim() || 'granted from operator console' })
        }).then(function (d) {
            show(out, 'ok', '<b>Granted — ' + esc(d.plan) + '.</b>' + (d.currentPeriodEnd ? 'Expires ' + when(d.currentPeriodEnd) + '.' : 'Never expires.'));
            say.style.display = 'block';
            say.innerHTML = '<em>Reply with:</em>Sorted — open the extension\'s Welcome tab → <b>Already paid? Unlock it here</b> → enter <b>' + esc(email) + '</b>. Sorry for the trouble.';
        }).catch(function (e) { show(out, 'bad', esc(e.message)); });
    });

    // ---- recent -----------------------------------------------------------
    $('recent').addEventListener('click', function () {
        var out = $('recentOut');
        show(out, 'plain', 'Loading…');
        call('/admin/licenses').then(function (d) {
            if (!d.returned) { show(out, 'plain', 'No licences yet.'); return; }
            var html = '<b>' + d.returned + ' licence(s)' + (d.truncated ? ' (more exist)' : '') + '</b><div class="kv">';
            d.licenses.forEach(function (l) {
                html += '<div><span>' + when(l.createdAt) + '</span><span>' + esc(l.email || '—') + ' · ' + esc(l.plan) + ' · ' + esc(l.status) + '</span></div>';
            });
            show(out, 'plain', html + '</div>');
        }).catch(function (e) { show(out, 'bad', esc(e.message)); });
    });
})();
</script>
</body>
</html>
